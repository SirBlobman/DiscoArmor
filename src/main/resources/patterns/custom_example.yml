id: "custom_example"
menu-icon:
  type: MATERIAL
  material: PLAYER_HEAD
  quantity: 1
  # Base64 Player Head Skin Texture URL
  skin: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTE1MjA5NDFlMDZlM2I2YWVkODJiNDYwMjdhNzZiOGJlMWZiNzg2MzVjZmQ2YjcxY2NmZTU5NTA5MTM0MGQ3YyJ9fX0="
type: CUSTOM
custom-patterns:
  HELMET:
    type: FRAMES
    animation-type: LOOP
    # Color Format: red;green;blue. You can also use random(min, max) instead of a specific number. Min and max are inclusive
    # Trim Format: namespace:material;namespace:pattern
    # Duration: Time in ticks to display the frame. Default follows the armor-speed in config.yml
    #
    frames:
      1:
        color: "random(0,255);0;0"
        trim: "minecraft:diamond;minecraft:eye"
        duration: 20
      2:
        color: "0;random(0,255);0"
        trim: "minecraft:amethyst;minecraft:eye"
        duration: 20
      3:
        color: "0;0;random(0,255)"
        trim: "minecraft:redstone;minecraft:eye"
        duration: 20
  CHESTPLATE:
    type: COPY
    copy-from: HELMET
  LEGGINGS:
    type: COPY
    copy-from: HELMET
  BOOTS:
    type: FIXED
    color: "0;0;0"
